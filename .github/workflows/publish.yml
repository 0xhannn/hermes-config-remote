name: Publish to npm

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  id-token: write  # OIDC untuk npm trusted publishing

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      # npm terbaru untuk dukungan OIDC penuh
      - run: npm install -g npm@latest

      # Trusted Publisher OIDC — TANPA NPM_TOKEN
      - run: npm publish --provenance --access public
